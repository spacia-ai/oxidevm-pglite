# This workflow starts on request only. The @oxidevm packages of the CLI that generated this project are on a private registry
# that GitHub's runners cannot reach, so an automatic run would fail on every push. Give it the push (and pull_request, or tag)
# trigger of the public template once the packages install from a registry the runner can reach.
name: ci
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Fetch the mirrored WebAssembly, checked against upstream/lock.json
        run: node scripts/fetch-upstream.ts
      - run: pnpm run check
      - run: pnpm test
